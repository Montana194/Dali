services:
  db:
    image: mariadb:10.11
    container_name: dali-db
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: daliaudit_root_pass_2026
      MYSQL_DATABASE: daliaudit_db
      MYSQL_USER: daliaudit
      MYSQL_PASSWORD: daliaudit_secure_pass_2026
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: dali-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:3004"
      - "3004:3004"
    environment:
      PORT: 3004
      HOST: "0.0.0.0"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: daliaudit_db
      DB_USER: daliaudit
      DB_PASSWORD: daliaudit_secure_pass_2026
      SESSION_SECRET: dali-production-cloud-session-secret-2026
      SESSION_COOKIE_NAME: daliaudit.sid
      INTEGRATION_API_KEY: oZh1fMRqnYFVySSdPhITpodaihiK4nCrhCgbnjYMTwc
      DALIAUDIT_API_TOKEN: oZh1fMRqnYFVySSdPhITpodaihiK4nCrhCgbnjYMTwc

volumes:
  db_data:
